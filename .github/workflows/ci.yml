name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Release script
        run: |
          shellcheck deploy/*.sh firmware/scripts/*.sh
          bash deploy/staging-release.test.sh
      - name: Migrations match the schema
        run: |
          npm run db:generate -w server
          git diff --exit-code -- server/drizzle
          test -z "$(git status --porcelain -- server/drizzle)"
      - name: Portal strings are up to date
        run: |
          npm run firmware:strings -w shared
          git diff --exit-code -- firmware/src/generated

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio test -e native
      - run: pio run -e staging -e production
      - run: bash scripts/release.test.sh
