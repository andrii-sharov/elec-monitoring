<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Electricity Monitor" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .trace{stroke-dasharray:14 200;stroke-dashoffset:14;animation:trace 2.4s linear infinite}
    .ring{transform-origin:52px 22px;animation:ring 2.4s ease-out infinite}
    .dot{transform-origin:52px 22px;animation:kick 2.4s ease-out infinite}
    @keyframes trace{0%{stroke-dashoffset:14}70%,100%{stroke-dashoffset:-100}}
    @keyframes kick{0%,62%{transform:scale(1)}70%{transform:scale(1.3)}85%,100%{transform:scale(1)}}
    @keyframes ring{0%,65%{transform:scale(1);opacity:0}70%{opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){.trace,.ring,.dot{animation:none}.trace,.ring{opacity:0}}
  </style>
  <rect width="64" height="64" rx="14" fill="#151E27"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2A3742" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 40 H20 V22 H38 V40 H46 V22 H52" stroke="#C8F560" stroke-width="4.5"/>
    <path class="trace" pathLength="100" d="M8 40 H20 V22 H38 V40 H46 V22 H52" stroke="#F4FFD6" stroke-width="4.5"/>
  </g>
  <circle class="ring" cx="52" cy="22" r="4.5" fill="none" stroke="#5CE1E6" stroke-width="1.5"/>
  <circle class="dot" cx="52" cy="22" r="4.5" fill="#5CE1E6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
