<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{subject}}</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .em-page {
          background: #0b1015 !important;
        }
        .em-card {
          background: #151e27 !important;
          border-color: #2a3742 !important;
        }
        .em-text {
          color: #e8f0f4 !important;
        }
        .em-muted {
          color: #93a4b0 !important;
        }
        .em-brand {
          color: #c8f560 !important;
        }
        .em-button {
          background: #c8f560 !important;
        }
        .em-button a {
          color: #0b1015 !important;
        }
        .em-link {
          color: #c8f560 !important;
        }
      }
      @media (max-width: 620px) {
        .em-card td {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background: #f3f6f8">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">{{preheader}}</div>
    <table
      role="presentation"
      class="em-page"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #f3f6f8"
    >
      <tr>
        <td align="center" style="padding: 32px 12px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 560px"
          >
            <tr>
              <td style="padding: 0 4px 20px">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding-right: 12px">
                      <img
                        src="{{logoUrl}}"
                        width="40"
                        height="40"
                        alt=""
                        style="display: block; border: 0; border-radius: 9px"
                      />
                    </td>
                    <td
                      class="em-brand"
                      style="
                        font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
                        font-size: 16px;
                        font-weight: 700;
                        color: #4d7a00;
                      "
                    >
                      {{appName}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td>
                <table
                  role="presentation"
                  class="em-card"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="background: #ffffff; border: 1px solid #d3dce2; border-radius: 16px"
                >
                  <tr>
                    <td
                      class="em-text"
                      style="
                        padding: 32px 40px 8px;
                        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                        font-size: 16px;
                        line-height: 24px;
                        color: #0b1015;
                      "
                    >
                      <p style="margin: 0 0 24px">{{intro}}</p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 0 40px 24px">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td class="em-button" style="background: #0b1015; border-radius: 10px">
                            <a
                              href="{{link}}"
                              style="
                                display: inline-block;
                                padding: 12px 22px;
                                font-family:
                                  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                                font-size: 15px;
                                font-weight: 600;
                                line-height: 20px;
                                color: #c8f560;
                                text-decoration: none;
                                border-radius: 10px;
                              "
                              >{{action}}</a
                            >
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td
                      class="em-muted"
                      style="
                        padding: 0 40px 32px;
                        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                        font-size: 14px;
                        line-height: 21px;
                        color: #4f6070;
                      "
                    >
                      <!-- {{#notes}} one <p> per note -->
                      <p style="margin: 0 0 12px">{{note}}</p>
                      <!-- {{/notes}} -->
                      <p style="margin: 16px 0 0; word-break: break-all">
                        {{linkHint}}<br /><a class="em-link" href="{{link}}" style="color: #4d7a00"
                          >{{link}}</a
                        >
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                class="em-muted"
                align="center"
                style="
                  padding: 20px 12px 0;
                  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                  font-size: 12px;
                  line-height: 18px;
                  color: #4f6070;
                "
              >
                {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
