    <rect class="on" x="55" y="104" width="23" height="24" rx="6" fill-opacity="0.62"/>
    <rect class="on" x="82" y="104" width="23" height="24" rx="6" fill-opacity="0.69"/>
    <rect class="on" x="109" y="104" width="23" height="24" rx="6" fill-opacity="0.76"/>
    <rect class="on" x="136" y="104" width="23" height="24" rx="6" fill-opacity="0.83"/>
    <rect class="on" x="163" y="104" width="23" height="24" rx="6" fill-opacity="0.90"/>
    <rect class="on" x="190" y="104" width="23" height="24" rx="6" fill-opacity="0.97"/>
  </g>
</svg>
