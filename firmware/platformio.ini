[platformio]
default_envs = staging
extra_configs = platformio_override.ini

[device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    keys/ota-signing.pub.pem
    certs/isrg-roots.pem
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
extra_scripts = pre:scripts/fw_version.py
lib_deps = bblanchon/ArduinoJson@^7

[env:staging]
extends = device
custom_server_url = https://staging-api.elec-monitoring.homes

[env:production]
extends = device
custom_server_url = https://api.elec-monitoring.homes

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
lib_compat_mode = off
lib_deps = bblanchon/ArduinoJson@^7
