<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electricity Monitor</title>
    <meta
      name="description"
      content="Монітор електрики: пристрій у розетці повідомляє в Telegram, коли зникає й повертається світло."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1015" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Electricity Monitor" />
    <meta
      property="og:description"
      content="Монітор електрики: пристрій у розетці повідомляє в Telegram, коли зникає й повертається світло."
    />
    <meta property="og:image" content="/og-image-uk.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('em.theme');
        } catch (error) {}
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = choice === 'system' ? prefersDark : choice !== 'light';
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
